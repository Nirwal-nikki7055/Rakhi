
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flower Shower 🌸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Image Box */
        .image-box {
            width: 260px;
            height: 330px;
            background: white;
            border: 5px solid #ff9fba;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            z-index: 10;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Falling Flowers */
        .flower {
            position: fixed;
            top: -50px;
            font-size: 28px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.9;
            }
        }

        /* Different flower positions and speeds */
        .f1 { left: 5%;  animation-duration: 5s; }
        .f2 { left: 15%; animation-duration: 7s; animation-delay: 1s; }
        .f3 { left: 25%; animation-duration: 6s; animation-delay: 2s; }
        .f4 { left: 35%; animation-duration: 8s; animation-delay: 0.5s; }
        .f5 { left: 45%; animation-duration: 5.5s; animation-delay: 1.5s; }
        .f6 { left: 55%; animation-duration: 7s; animation-delay: 2.5s; }
        .f7 { left: 65%; animation-duration: 6s; animation-delay: 1s; }
        .f8 { left: 75%; animation-duration: 8s; animation-delay: 3s; }
        .f9 { left: 85%; animation-duration: 5s; animation-delay: 0.8s; }
        .f10 { left: 95%; animation-duration: 7s; animation-delay: 2s; }


        .smile-text {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
    color: #e75480;
    text-align: center;
    z-index: 30;
}

    </style>
</head>

<body>

    <!-- Flower Shower -->
    <div class="flower f1">🌸</div>
    <div class="flower f2">🌺</div>
    <div class="flower f3">🌼</div>
    <div class="flower f4">🌷</div>
    <div class="flower f5">🌸</div>
    <div class="flower f6">🌺</div>
    <div class="flower f7">🌼</div>
    <div class="flower f8">🌷</div>
    <div class="flower f9">🌸</div>
    <div class="flower f10">🌺</div>

    <!-- Image Box -->
    <div class="image-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_dEClE8FdqmNnBH3GaYjfcsLNgFDURLVAhIDap0nzrA&s=10" alt="Your Image">
    </div>

    <div class="smile-text">
    Now smile for your sister! 😊❤️
</div>
   

</body>
</html>
