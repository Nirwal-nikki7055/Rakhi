<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Best Brother Certificate 🏆</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 20px;

            font-family: "Comic Sans MS", cursive, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e5,
                #fff1f6,
                #ffdce8
            );

            overflow-x: hidden;
            overflow-y: auto; 
        }


        /* Floating emojis */

        .emoji {

            position: absolute;

            font-size: 40px;

            animation: float 4s ease-in-out infinite;
        }


        .e1 {
            top: 8%;
            left: 8%;
        }

        .e2 {
            top: 15%;
            right: 8%;
            animation-delay: 1s;
        }

        .e3 {
            bottom: 12%;
            left: 7%;
            animation-delay: 2s;
        }

        .e4 {
            bottom: 10%;
            right: 8%;
            animation-delay: 1.5s;
        }


        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-18px) rotate(8deg);
            }

        }


        /* Certificate */

        .certificate {

            width: 90%;

            max-width: 750px;

            background: #fffdf8;

            padding: 55px 40px;

            text-align: center;

            border: 10px solid #e9a1b5;

            outline: 3px dashed #bd3158;

            outline-offset: -22px;

            border-radius: 15px;

            box-shadow:
                0 25px 60px rgba(180, 70, 100, 0.25);

            animation: appear 1s ease;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform: scale(0.7) rotate(-3deg);

            }

            to {

                opacity: 1;

                transform: scale(1) rotate(0);

            }

        }


        .trophy {

            font-size: 75px;

            margin-bottom: 10px;

            animation: bounce 2s infinite;
        }


        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }


        .small-title {

            color: #8d6370;

            font-size: 18px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        h1 {

            color: #bd3158;

            font-size: 45px;

            margin-bottom: 20px;

        }


        .line {

            width: 180px;

            height: 3px;

            background: #e89aae;

            margin: 0 auto 25px;

        }


        .text {

            color: #674653;

            font-size: 20px;

            line-height: 1.7;

        }


        .best {

            color: #d6336c;

            font-size: 30px;

            font-weight: bold;

            margin: 15px 0;

        }


        .funny {

            margin-top: 25px;

            color: #777;

            font-size: 17px;

        }


        .signature {

            margin-top: 35px;

            color: #bd3158;

            font-size: 20px;

            font-weight: bold;

        }
        

       
        /* Gift 2 Button */

.gift-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 28px;
    background: #bd3158;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(189, 49, 88, 0.25);
    transition: 0.3s ease;
}

.gift-btn:hover {
    background: #a9254a;
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 25px rgba(189, 49, 88, 0.35);
}

        /* Mobile */

        @media(max-width: 600px) {

            .certificate {

                padding: 45px 25px;

                border-width: 7px;

            }


            h1 {

                font-size: 34px;

            }


            .trophy {

                font-size: 60px;

            }


            .text {

                font-size: 17px;

            }


            .best {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- Floating emojis -->

    <div class="emoji e1">😂</div>

    <div class="emoji e2">🏆</div>

    <div class="emoji e3">😎</div>

    <div class="emoji e4">🤣</div>


    <!-- Certificate -->

    <div class="certificate">


        <div class="trophy">
            🏆
        </div>


        <div class="small-title">
            Official Certificate
        </div>


        <h1>
            Best Brother
        </h1>


        <div class="line"></div>


        <p class="text">

            This certificate is proudly awarded to

        </p>


        <div class="best">
            my  Brother ! 😎
        </div>


       

        <p class="funny">

            ⭐ Awarded for outstanding brotherly skills ⭐

        </p>


        <div class="signature">

            With love & lots of complaints 😂

            <br>

            — Your Sister 🫶

        </div>
        <a href="gifts.html" class="gift-btn">
       🎁 Go Back for Gift 2
      </a> 


    </div>


</body>

</html>
