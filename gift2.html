<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You Are My... 😂</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            padding: 35px 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fff1f4;

            font-family: "Comic Sans MS", cursive, sans-serif;

            overflow-x: hidden;
        }


        /* Main scrapbook */

        .scrapbook {

            width: 100%;
            max-width: 900px;

            min-height: 650px;

            background: #fffdf8;

            position: relative;

            padding: 45px 50px;

            border: 14px solid #f4b6c5;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(170, 70, 100, 0.2);

            overflow: hidden;
        }


        /* Gingham effect */

        .scrapbook::before {

            content: "";

            position: absolute;

            inset: 0;

            z-index: 0;

            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 18px,
                    rgba(239, 71, 114, 0.06) 19px,
                    rgba(239, 71, 114, 0.06) 20px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 18px,
                    rgba(239, 71, 114, 0.06) 19px,
                    rgba(239, 71, 114, 0.06) 20px
                );

            pointer-events: none;
        }


        /* Content */

        .content {

            position: relative;

            z-index: 2;

            text-align: center;
        }


        /* Heading */

        h1 {

            font-size: 55px;

            color: #b92e4f;

            letter-spacing: 2px;

            margin-bottom: 30px;

            transform: rotate(-2deg);
        }


        .heading-decoration {

            position: absolute;

            font-size: 30px;

            top: -5px;

            right: 80px;

            transform: rotate(15deg);
        }


        /* Center area */

        .center {

            position: relative;

            height: 440px;

            max-width: 800px;

            margin: auto;
        }


        /* Shinchan */

        .shinchan {

            position: absolute;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            font-size: 145px;

            z-index: 5;

            animation: shy 2s ease-in-out infinite;
        }


        @keyframes shy {

            0%, 100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            50% {
                transform: translate(-50%, -52%) rotate(-4deg);
            }
        }


        /* Labels */

        .label {

            position: absolute;

            color: #562c38;

            font-size: 22px;

            font-weight: bold;

            line-height: 1.25;

            z-index: 4;
        }


        .label::after {

            content: "";

            position: absolute;

            width: 70px;

            height: 30px;

            border-bottom: 2px solid #7c4a57;

            border-radius: 50%;
        }


        /* Google Maps */

        .maps {

            top: 10px;

            left: 50%;

            transform: translateX(-50%);

        }

        .maps::after {

            left: 45%;

            top: 35px;

            transform: rotate(90deg);
        }


        /* My Lifeline */

        .lifeline {

            top: 80px;

            left: 30px;

        }

        .lifeline::after {

            right: -75px;

            top: 30px;

            transform: rotate(20deg);
        }


        /* Bank Account */

        .bank {

            top: 210px;

            left: 20px;

        }

        .bank::after {

            right: -75px;

            top: 15px;

            transform: rotate(-5deg);
        }


        /* Irreplaceable Human */

        .irreplaceable {

            bottom: 35px;

            left: 25px;

        }

        .irreplaceable::after {

            right: -90px;

            top: -10px;

            transform: rotate(-20deg);
        }


        /* Bodyguard */

        .bodyguard {

            top: 85px;

            right: 25px;

        }

        .bodyguard::after {

            left: -80px;

            top: 25px;

            transform: rotate(-20deg);
        }


        /* Wifi */

        .wifi {

            top: 215px;

            right: 20px;

        }

        .wifi::after {

            left: -80px;

            top: 10px;

            transform: rotate(5deg);
        }


        /* Supporter */

        .supporter {

            bottom: 40px;

            right: 35px;

        }

        .supporter::after {

            left: -90px;

            top: -10px;

            transform: rotate(20deg);
        }


        /* Little decorations */

        .doodle {

            position: absolute;

            color: #e04465;

            font-size: 30px;

            z-index: 3;
        }

        .d1 {
            top: 80px;
            left: 20px;
        }

        .d2 {
            top: 65px;
            right: 30px;
        }

        .d3 {
            bottom: 20px;
            left: 48%;
        }


        /* Bottom */

        .bottom {

            color: #8c5361;

            font-size: 18px;

            margin-top: 5px;

            transform: rotate(1deg);
        }


        /* Mobile */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .scrapbook {

                padding: 35px 20px;

                border-width: 9px;
            }

            h1 {

                font-size: 35px;

                margin-bottom: 15px;
            }

            .center {

                height: 520px;
            }

            .shinchan {

                font-size: 95px;
            }

            .label {

                font-size: 15px;
            }

            .maps {
                top: 0;
            }

            .lifeline {
                left: 0;
                top: 95px;
            }

            .bank {
                left: 0;
                top: 230px;
            }

            .irreplaceable {
                left: 0;
                bottom: 20px;
            }

            .bodyguard {
                right: 0;
                top: 95px;
            }

            .wifi {
                right: 0;
                top: 230px;
            }

            .supporter {
                right: 0;
                bottom: 20px;
            }

            .bottom {
                font-size: 15px;
            }
        }
        .next-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: #b92e4f;
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    box-shadow: 0 5px 12px rgba(185, 46, 79, 0.3);
    transition: 0.3s ease;
}

.next-btn:hover {
    transform: scale(1.08);
    background: #d63d60;
}
    </style>

</head>


<body>


    <div class="scrapbook">


        <div class="content">


            <h1>
                YOU ARE MY
            </h1>


            <div class="heading-decoration">
                ✏️
            </div>


            <div class="center">


                <!-- Decorations -->

                <div class="doodle d1">✦</div>

                <div class="doodle d2">♡</div>

                <div class="doodle d3">♡</div>


                <!-- Labels -->


                <div class="label maps">
                    Google Maps 🗺️
                </div>


                <div class="label lifeline">
                    My Lifeline
                </div>


                <div class="label bank">
                    Bank<br>
                    Account 💸
                </div>


                <div class="label irreplaceable">
                    Irreplaceable<br>
                    Human 😂
                </div>


                <div class="label bodyguard">
                    Bodyguard 🛡️
                </div>


                <div class="label wifi">
                    WiFi Without<br>
                    Password 📶
                </div>


                <div class="label supporter">
                    Supporter 🤝
                </div>


                <!-- Center Shinchan -->

                <div class="shinchan">
                    🥺
                </div>


            </div>


            <p class="bottom">
                east or west , my brother is the best
            </p>
   

           <a href="gifts.html" class="next-btn">
          🎁 go back for  Gift 3 💖
          </a>


        </div>


    </div>


</body>

</html>
