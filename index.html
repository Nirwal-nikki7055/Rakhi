<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Bhaiya ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: linear-gradient(135deg, #ffdce8, #fff0f5, #ffd9e6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Floating hearts */
        .heart-bg {
            position: fixed;
            font-size: 35px;
            opacity: 0.7;
            animation: float 4s ease-in-out infinite;
            z-index: -1;
        }

        .h1 { top: 8%; left: 7%; }
        .h2 { top: 15%; right: 8%; animation-delay: 1s; }
        .h3 { bottom: 15%; left: 6%; animation-delay: 2s; }
        .h4 { bottom: 10%; right: 8%; animation-delay: 1.5s; }
        .h5 { top: 45%; left: 3%; animation-delay: 0.5s; }
        .h6 { top: 50%; right: 4%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 35px 30px 50px;
            box-shadow: 0 20px 50px rgba(190, 70, 110, 0.18);
        }

        /* Shy Shinchan */
        .shinchan {
            font-size: 130px;
            margin-bottom: 10px;
            animation: shy 2s ease-in-out infinite;
        }

        @keyframes shy {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(-2deg);
            }
        }

        h1 {
            color: #bd3158;
            font-size: 38px;
            line-height: 1.3;
            margin: 10px auto 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px auto;
            color: #ff7b9c;
        }

        .divider::before,
        .divider::after {
            content: "";
            width: 100px;
            height: 2px;
            background: #ffabc0;
        }

        .divider span {
            font-size: 22px;
        }

        .subtitle {
            color: #70465c;
            font-size: 20px;
            margin-bottom: 25px;
        }

        /* Button */
        button {
            border: none;
            background: linear-gradient(135deg, #ef4772, #d92f5d);
            color: white;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(217, 47, 93, 0.3);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 25px rgba(217, 47, 93, 0.4);
        }

        /* Curved message area */
        .message-wrapper {
            margin: 70px auto 0;
            position: relative;
            width: 330px;
            height: 330px;
        }

        /* Curved dashed arrow */
        .arrow {
            position: absolute;
            width: 100px;
            height: 100px;
            border-left: 3px dashed #f05a7d;
            border-bottom: 3px dashed #f05a7d;
            border-radius: 0 0 0 70px;
            top: -55px;
            left: -10px;
            transform: rotate(-20deg);
        }

        .arrow::after {
            content: "➜";
            position: absolute;
            color: #e63b65;
            font-size: 25px;
            bottom: -14px;
            left: -13px;
            transform: rotate(35deg);
        }

        /* Circular message */
        .message {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: white;
            border: 3px dashed #f16b8b;
            box-shadow: 0 12px 30px rgba(190, 70, 110, 0.15);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px;
            margin: auto;
            position: relative;
        }

        .message::before {
            content: "♡";
            position: absolute;
            top: 25px;
            font-size: 35px;
            color: #c92e58;
        }

        .message p {
            color: #bd3158;
            font-size: 24px;
            line-height: 1.6;
            font-weight: bold;

            /* Curved feeling */
            transform: rotate(-3deg);
        }

        .small-heart {
            position: absolute;
            color: #ff9ab1;
            font-size: 22px;
        }

        .one {
            top: 70px;
            left: 45px;
        }

        .two {
            top: 85px;
            right: 45px;
        }

        .three {
            bottom: 70px;
            left: 40px;
        }

        .four {
            bottom: 65px;
            right: 40px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 30px 20px 40px;
            }

            .shinchan {
                font-size: 95px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 17px;
            }

            .message-wrapper {
                width: 290px;
                height: 290px;
            }

            .message {
                width: 270px;
                height: 270px;
                padding: 40px;
            }

            .message p {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart-bg h1">💗</div>
    <div class="heart-bg h2">💖</div>
    <div class="heart-bg h3">💕</div>
    <div class="heart-bg h4">💗</div>
    <div class="heart-bg h5">♡</div>
    <div class="heart-bg h6">💓</div>


    <div class="container">

        <!-- Main Card -->
        <div class="card">

            <!-- Shy Shinchan -->
            <div class="shinchan">🥺</div>

            <h1>
                There’s something here<br>
                 for you. 🥰
            </h1>

            <div class="divider">
                <span>♥</span>
            </div>

            <p class="subtitle">
                Bas ek baar button dabao... 👀✨
            </p>

            <button onclick="showMessage()">
                Click Here 💌
            </button>

        </div>


        <!-- Message -->
        <div class="message-wrapper">

            <div class="arrow"></div>

            <div class="message">

                <span class="small-heart one">♥</span>
                <span class="small-heart two">♥</span>
                <span class="small-heart three">♥</span>
                <span class="small-heart four">♥</span>

                <p>
                    Brother,<br>
                    this is something<br>
                    just for you! ❤️
                </p>

            </div>

        </div>

    </div>


    <script>

        function showMessage() {

            
                   window.location.href = "click.html";

        }

    </script>

</body>
</html>
